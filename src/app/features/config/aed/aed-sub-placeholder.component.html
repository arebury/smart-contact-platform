<div class="page">
  <div class="page__inner">
    <header class="page__header">
      <h1 class="page__title">{{ headingKey | translate }}</h1>
      <p class="page__subtitle">{{ subtitleKey | translate }}</p>
    </header>

    <div class="empty">
      <span class="empty__icon" aria-hidden="true">
        <lucide-icon [img]="icon" [size]="20" />
      </span>
      <p class="empty__title">{{ emptyTitleKey | translate }}</p>
      <p class="empty__body">{{ emptyBodyKey | translate }}</p>
    </div>
  </div>
</div>
