<div class="settings-shell">
  @if (headerState(); as h) {
    <div class="settings-shell__header">
      <aed-page-header
        [titleKey]="h.titleKey"
        [subtitleKey]="h.subtitleKey"
        [entityKey]="h.entityKey"
        [icon]="h.icon"
      />
    </div>
  }
  <div class="settings-shell__body">
    <div class="settings-shell__rail">
      <aed-settings-sidebar />
    </div>
    <div class="settings-shell__main">
      <router-outlet />
    </div>
  </div>
</div>
