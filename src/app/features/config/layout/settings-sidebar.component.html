<aside class="settings-sidebar">
  <div class="settings-sidebar__head">
    <p class="settings-sidebar__title">
      {{ 'config.sidebar.title' | translate }}
    </p>
    <p class="settings-sidebar__subtitle">
      {{ 'config.sidebar.subtitle' | translate }}
    </p>
  </div>

  <nav class="settings-sidebar__nav" aria-label="Configuración">
    @for (item of items; track item.path) {
      <a
        class="nav-item"
        routerLinkActive="nav-item--active"
        [routerLink]="item.path"
      >
        <span class="nav-item__icon" aria-hidden="true">
          <lucide-icon [img]="item.icon" [size]="15" />
        </span>
        <span class="nav-item__copy">
          <span class="nav-item__label">{{ item.labelKey | translate }}</span>
          <span class="nav-item__hint">{{ item.hintKey | translate }}</span>
        </span>
      </a>
    }
  </nav>

  <div class="settings-sidebar__foot">
    <span>{{ 'config.sidebar.version' | translate }}</span>
  </div>
</aside>
