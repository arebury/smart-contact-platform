<div class="page">
  <div class="page__inner">
    <header class="page__header">
      <h1 class="page__title">{{ 'config.seguridad.heading' | translate }}</h1>
      <p class="page__subtitle">{{ 'config.seguridad.subtitle_empty' | translate }}</p>
    </header>

    <div class="empty">
      <span class="empty__icon" aria-hidden="true">
        <lucide-icon [img]="shieldIcon" [size]="20" aria-hidden="true" />
      </span>
      <p class="empty__title">{{ 'config.seguridad.empty.title' | translate }}</p>
      <p class="empty__body">{{ 'config.seguridad.empty.body' | translate }}</p>
    </div>
  </div>
</div>
