<header class="sticky-header">
  @if (!hideBack()) {
    <div class="sticky-header__nav-row">
      <button
        type="button"
        class="sticky-header__back"
        (click)="cancelled.emit()"
        [attr.aria-label]="'common.back' | translate"
      >
        <lucide-icon [img]="backIcon" [size]="14" [attr.aria-hidden]="true" />
        <span>{{ 'common.back' | translate }}</span>
      </button>
    </div>
  }

  <div class="sticky-header__main-row">
  <div class="sticky-header__leading">
    <ng-content select="[header-leading]" />
  </div>
  @if (!hideTitleBlock()) {
  <div class="sticky-header__title-block">
    <span class="sticky-header__entity">{{ entityKey() | translate }}</span>
    @if (mode() === 'create') {
      <span class="sticky-header__edit-row">
        <input
          type="text"
          class="sticky-header__name-input"
          [value]="name()"
          (input)="nameChange.emit($any($event.target).value)"
          [placeholder]="namePlaceholderKey() | translate"
          [attr.aria-label]="'common.edit' | translate"
        />
      </span>
    } @else {
      @if (editing()) {
        <span class="sticky-header__edit-row">
          <input
            #nameInput
            type="text"
            class="sticky-header__name-input"
            [value]="draftName()"
            (input)="onDraftInput($any($event.target).value)"
            (keydown)="onRenameKey($event)"
            [attr.aria-label]="'common.edit' | translate"
          />
          <button
            type="button"
            class="sticky-header__icon-btn"
            (click)="confirmRename()"
            [attr.aria-label]="'common.save' | translate"
          >
            <lucide-icon [img]="checkIcon" [size]="14" />
          </button>
          <button
            type="button"
            class="sticky-header__icon-btn"
            (click)="cancelRename()"
            [attr.aria-label]="'common.cancel' | translate"
          >
            <lucide-icon [img]="closeIcon" [size]="14" />
          </button>
        </span>
      } @else {
        <span class="sticky-header__name-row">
          <span class="sticky-header__name">{{ name() }}</span>
          <button
            type="button"
            class="sticky-header__icon-btn"
            (click)="onPencilClick()"
            [attr.aria-label]="'common.edit' | translate"
          >
            <lucide-icon [img]="pencilIcon" [size]="13" />
          </button>
        </span>
      }
    }
  </div>
  }

  <div class="sticky-header__actions">
    <button
      type="button"
      class="btn btn--primary"
      [disabled]="!canSave() || saving()"
      (click)="save.emit()"
    >
      @if (saving()) {
        <lucide-icon [img]="loaderIcon" [size]="13" class="btn__spin" [attr.aria-hidden]="true" />
        <span>{{ 'common.loading' | translate }}</span>
      } @else {
        <span>{{ 'common.save' | translate }}</span>
      }
    </button>
  </div>
  </div>
</header>
