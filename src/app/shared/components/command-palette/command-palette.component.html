@if (host.visible()) {
  <div class="palette-backdrop" (click)="onBackdropClick()" aria-hidden="true"></div>
  <div class="palette" role="dialog" aria-label="Buscar y ejecutar comandos" aria-modal="true">
    <div class="palette__head">
      <lucide-icon class="palette__head-icon" [img]="searchIcon" [size]="16" aria-hidden="true" />
      <input
        #searchInput
        type="text"
        class="palette__input"
        placeholder="Buscar páginas, acciones…"
        [value]="query()"
        (input)="query.set($any($event.target).value)"
        autocomplete="off"
        spellcheck="false"
      />
      <kbd class="palette__kbd" aria-hidden="true">Esc</kbd>
    </div>

    <div class="palette__body">
      @if (filtered().length === 0) {
        <div class="palette__empty">Sin resultados</div>
      } @else {
        @for (group of grouped(); track group.category) {
          <div class="palette__group">
            <div class="palette__group-title">{{ group.category }}</div>
            @for (cmd of group.items; track cmd.id) {
              <button
                type="button"
                class="palette__item"
                [class.palette__item--active]="highlighted() === indexOf(cmd)"
                (mouseenter)="onItemHover(cmd)"
                (click)="run(cmd)"
              >
                @if (resolveIcon(cmd.icon); as ic) {
                  <lucide-icon class="palette__item-icon" [img]="ic" [size]="14" />
                }
                <span class="palette__item-label">{{ cmd.label }}</span>
              </button>
            }
          </div>
        }
      }
    </div>

    <div class="palette__foot">
      <span class="palette__hint">
        <kbd>↑</kbd><kbd>↓</kbd>
        <span>navegar</span>
      </span>
      <span class="palette__hint">
        <kbd>↵</kbd>
        <span>seleccionar</span>
      </span>
      <span class="palette__hint">
        <kbd>Esc</kbd>
        <span>cerrar</span>
      </span>
    </div>
  </div>
}
