<span class="page-title-count" aria-live="polite" aria-atomic="true">
  <span class="page-title-count__sep" aria-hidden="true">·</span>
  @if (isFiltered()) {
    <span class="page-title-count__num">{{ filtered() }}</span>
    <span class="page-title-count__of">de {{ total() }}</span>
  } @else {
    <span class="page-title-count__num">{{ total() }}</span>
  }
</span>
