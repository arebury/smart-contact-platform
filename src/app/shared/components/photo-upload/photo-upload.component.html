<div class="photo-upload">
  <button
    type="button"
    class="photo-upload__button"
    (click)="openPicker()"
    (mouseenter)="hovering.set(true)"
    (mouseleave)="hovering.set(false)"
    [attr.aria-label]="photo() ? ariaLabel() : ('common.photo.select' | translate)"
    [title]="photo() ? ariaLabel() : ('common.photo.select' | translate)"
  >
    @if (photo(); as src) {
      <img class="photo-upload__image" [src]="src" alt="" />
    } @else {
      @if (name(); as entityName) {
        <aed-illustrated-avatar class="photo-upload__illustrated" [name]="entityName" [size]="64" />
      } @else {
        <lucide-icon [img]="placeholderIcon" [size]="28" class="photo-upload__placeholder"  aria-hidden="true" />
      }
    }
    <span class="photo-upload__overlay" [class.photo-upload__overlay--visible]="hovering()">
      <lucide-icon [img]="cameraIcon" [size]="16" aria-hidden="true" />
    </span>
  </button>
  <input
    #fileInput
    type="file"
    accept="image/jpeg,image/png,image/gif"
    class="photo-upload__input"
    (change)="onFileChange($event)"
  />
  <span class="photo-upload__hint">{{ 'common.photo.hint' | translate }}</span>
  @if (photo()) {
    <button type="button" class="photo-upload__remove" (click)="onRemove()">
      {{ 'common.photo.remove' | translate }}
    </button>
  }
</div>
