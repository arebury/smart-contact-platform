<div class="bulk-edit" role="group" aria-label="Editar en bloque">
  <label class="bulk-edit__pair">
    <span class="bulk-edit__lead">Cambiar</span>
    <span class="bulk-edit__select">
      <select
        [value]="selectedFieldKey()"
        (change)="onFieldChange($event)"
        aria-label="Campo a editar"
      >
        @for (f of fields(); track f.key) {
          <option [value]="f.key">{{ f.label }}</option>
        }
      </select>
      <lucide-icon class="bulk-edit__chev" [img]="chevronIcon" [size]="16" />
    </span>
  </label>

  <label class="bulk-edit__pair">
    <span class="bulk-edit__lead">a</span>
    <span class="bulk-edit__select">
      <select [value]="selectedValue()" (change)="onValueChange($event)" aria-label="Nuevo valor">
        @for (v of selectedField()?.values ?? []; track v.value) {
          <option [value]="v.value">{{ v.label }}</option>
        }
      </select>
      <lucide-icon class="bulk-edit__chev" [img]="chevronIcon" [size]="16" />
    </span>
  </label>

  <button
    type="button"
    class="btn btn--secondary bulk-edit__apply"
    [disabled]="!canApply()"
    (click)="onApply()"
  >
    Aplicar
  </button>
</div>
