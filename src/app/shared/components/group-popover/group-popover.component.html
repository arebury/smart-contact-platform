<div
  class="group-popover"
  (mouseenter)="onEnter()"
  (mouseleave)="onLeave()"
  (focusin)="onFocus()"
  (focusout)="onBlur()"
  (keydown)="onKeydown($event)"
>
  <button
    type="button"
    class="group-popover__trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'common.groups_count' | translate: { count: count() }"
  >
    {{ 'common.groups_count' | translate: { count: count() } }}
  </button>
  @if (open() && count() > 0) {
    <div class="group-popover__panel" role="tooltip">
      <ul class="group-popover__list">
        @for (group of visible(); track group.id) {
          <li class="group-popover__item">{{ group.name }}</li>
        }
      </ul>
      @if (overflowCount() > 0) {
        <div class="group-popover__more">
          {{ 'common.groups_more' | translate: { count: overflowCount() } }}
        </div>
      }
    </div>
  }
</div>
