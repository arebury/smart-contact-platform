<p-toast position="top-right">
  <ng-template let-message pTemplate="message">
    <div
      class="aed-toast"
      role="status"
      aria-live="assertive"
      aria-atomic="true"
      [attr.data-severity]="message.severity ?? 'info'"
    >
      <div class="aed-toast__icon" aria-hidden="true">
        <lucide-icon [img]="iconFor(message.severity)" [size]="14" />
      </div>
      <div class="aed-toast__body">
        @if (message.summary) {
          <div class="aed-toast__title">{{ message.summary }}</div>
        }
        @if (message.detail) {
          <div class="aed-toast__message">{{ message.detail }}</div>
        }
      </div>
      @if (message.data?.undoEntryId; as undoId) {
        <button type="button" class="aed-toast__action" (click)="onUndoClick(undoId)">
          {{ 'common.undo' | translate }}
        </button>
      }
      <button
        type="button"
        class="aed-toast__close"
        [attr.aria-label]="'common.close' | translate"
        (click)="onClose()"
      >
        <lucide-icon [img]="closeIcon" [size]="14" />
      </button>
    </div>
  </ng-template>
</p-toast>
<p-confirmDialog />
<router-outlet />
