<p-toast position="top-right">
  <ng-template let-message pTemplate="message">
    <div class="aed-toast" [attr.data-severity]="message.severity">
      <div class="aed-toast__body">
        <div class="aed-toast__summary">{{ message.summary }}</div>
        @if (message.detail) {
          <div class="aed-toast__detail">{{ message.detail }}</div>
        }
      </div>
      @if (message.data?.undoEntryId; as undoId) {
        <button type="button" class="aed-toast__action" (click)="onUndoClick(undoId)">
          {{ 'common.undo' | translate }}
        </button>
      }
    </div>
  </ng-template>
</p-toast>
<p-confirmDialog />
<router-outlet />
