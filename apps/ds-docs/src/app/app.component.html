<div class="shell">

      <span class="shell__brand-mark">SC</span>
      <span class="shell__brand-name">Design System</span>
    </a>

    <nav class="shell__menu">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">

      <a routerLink="/components/input" routerLinkActive="is-active">Input</a>

  <main class="shell__main">

</div>
