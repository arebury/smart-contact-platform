# Netlify build config — site `ds-smartcontact` (Smart Contact DS docs).
#
# Netlify UI debe tener este site con:
#   Base directory:    apps/ds-docs
#   Build command:     (vacío — lo lee de este archivo)
#   Publish directory: (vacío — lo lee de este archivo)
#
# Al setear Base directory = apps/ds-docs, Netlify ejecuta los comandos
# DESDE esa carpeta — por eso el `cd ../..` para volver a la raíz del
# monorepo (donde vive el package-lock.json + node_modules de npm
# workspaces).

[build]
  command = "cd ../.. && npm install --no-audit --no-fund && npm run build:ds-docs"
  publish = "../../dist/ds-docs/browser"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# SPA fallback: cualquier URL desconocida cae en index.html para que el
# Angular Router se haga cargo (refrescar /components/button no debe 404ear).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
