<div class="settings-shell">
  <div class="settings-shell__body">
    <div class="settings-shell__rail">
      <sc-settings-sidebar />
    </div>
    <div class="settings-shell__main">
      @if (headerState(); as h) {
        <header class="settings-shell__title" role="presentation">
          <h1>{{ h.titleKey | translate }}</h1>
          @if (h.subtitleKey) {
            <p>{{ h.subtitleKey | translate }}</p>
          }
        </header>
      }
      <router-outlet />
    </div>
  </div>
</div>
