<sc-modal
  [visible]="visible()"
  title="Procesar conversaciones"
  [subtitle]="subtitle()"
  width="720px"
  (cancelled)="onCancel()"
>
  <!-- Body 720×200, dos celdas equal divididas por hairline vertical.
       Layout v26 (Figma 297:2559). El header del sc-modal y la acción
       del footer permanecen idénticos al patrón canonical SC. -->
  <div class="bulkv26" data-testid="bulk-modal-body">
    <!-- ── Hero cell · Total a procesar ── -->
    <section class="bulkv26__cell bulkv26__cell--hero">
      <span class="bulkv26__label">Total a procesar</span>
      <div class="bulkv26__hero-stack">
        <div class="bulkv26__hero-row">
          <span
            class="bulkv26__hero-number"
            [class.is-bumping]="bumpKey() > 0"
            [attr.key]="bumpKey()"
            aria-live="polite"
          >
            {{ heroCount() }}
          </span>
          <!-- "genera coste" cue. Slot reservado siempre para que C1
               (isAllProcessed) no haga reflow al esconderlo. -->
          <span
            class="bulkv26__cost-cue"
            [class.is-hidden]="isAllProcessed()"
            [attr.aria-hidden]="isAllProcessed() ? 'true' : null"
          >
            genera coste
          </span>
        </div>
        <!-- Delta hint slot — min-height reservado, evita CLS al cambiar
             multi-rec / in-progress mid-modal. -->
        <span class="bulkv26__hero-hint" aria-live="polite">
          {{ heroDeltaHint() ?? ' ' }}
        </span>
      </div>
    </section>

    <!-- ── Decision cell · Análisis ── -->
    <section
      class="bulkv26__cell bulkv26__cell--decision"
      [class.is-shaking]="shakeKey() > 0"
      [attr.key-shake]="shakeKey()"
    >
      <span class="bulkv26__label">Análisis</span>
      <div class="bulkv26__decision-stack">
        <div class="bulkv26__decision-row">
          <span
            class="bulkv26__decision-title"
            [class.is-on]="toggleOn()"
            [class.is-off]="!toggleOn()"
          >
            Incluir análisis
          </span>
          <p-toggleswitch
            [ngModel]="toggleOn()"
            (ngModelChange)="onToggleChange($event)"
            [disabled]="toggleDisabled()"
            aria-label="Incluir análisis"
          />
        </div>

        <!-- Caption: "todo procesado" en C1; "N admiten análisis" resto. -->
        <div class="bulkv26__caption">
          @if (toggleDisabled()) {
            <span class="bulkv26__caption-muted">todo procesado</span>
          } @else {
            <span
              class="bulkv26__caption-num"
              [class.is-on]="toggleOn()"
              [class.is-pulsing]="pulseKey() > 0"
              [attr.key-pulse]="pulseKey()"
            >
              {{ nTrans() + nAnBase() }}
            </span>
            <span
              class="bulkv26__caption-pred"
              [class.is-on]="toggleOn()"
              [class.is-pulsing]="pulseKey() > 0"
            >
              {{ captionLabel() }}
            </span>
          }
        </div>
      </div>
    </section>
  </div>

  <!-- Audit A6 — error inline strip recuperable. Mantiene layout sin
       reflow al aparecer/desaparecer. -->
  @if (error(); as e) {
    <div class="bulkv26__error" role="alert">
      <lucide-icon [img]="alertIcon" [size]="14" class="bulkv26__error-icon" aria-hidden="true" />
      <p class="bulkv26__error-text">{{ e }}</p>
    </div>
  }

  <ng-container modalFooter>
    <p-button
      label="Cerrar"
      severity="secondary"
      text="true"
      [disabled]="isLoading()"
      (onClick)="onCancel()"
    />
    <p-button
      label="Procesar"
      [loading]="isLoading()"
      [disabled]="!canSubmit()"
      (onClick)="onConfirm()"
    />
  </ng-container>
</sc-modal>
