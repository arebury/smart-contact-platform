name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache Angular build
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: angular-${{ hashFiles('package-lock.json') }}
          restore-keys: angular-

      - name: Install dependencies
        # `npm install` (not `npm ci`) because Karma's chokidar@3 conflicts
        # with @angular/compiler-cli's chokidar@4 in the transitive tree.
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test (headless)
        run: npm run test:ci

      - name: Build (production)
        run: npm run build:all
