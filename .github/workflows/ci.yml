name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        # `npm install` (not `npm ci`) because @angular-eslint@18 carries peer-dep
        # warnings against Angular 21 that npm resolves via nested installs in the
        # lockfile; `npm ci` fails on first run before the lockfile is stabilised.
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: i18n audit
        run: npm run i18n:audit

      - name: Token guard
        run: npm run tokens:guard

      - name: Test (headless)
        run: npm run test:ci

      - name: Build (production)
        run: npm run build
