# Netlify build configuration for AED — SmartContact Supervisor.
#
# The Angular `application` builder emits a `browser/` folder under the
# configured outputPath. We point Netlify at that folder so it serves the
# real Angular build, not the source.

[build]
  # Use `npm install` (not `npm ci`) because Karma's `chokidar@3` and
  # @angular/compiler-cli's `chokidar@4` produce a transitive tree that
  # `npm ci` rejects under strict lockfile validation. `npm install` resolves
  # the conflict the same way the local install does.
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist/aed/browser"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# SPA fallback: every unknown URL must hit index.html so the Angular Router
# can take over (otherwise refreshing /admin/labels returns a 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
