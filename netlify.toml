# Netlify build config — Smart Contact Platform monorepo.
#
# IMPORTANTE: este archivo NO declara `[build].command` ni
# `[build].publish` porque Netlify les da prioridad sobre los settings
# de la UI de cada site, y en este monorepo CADA site necesita su
# propio command/publish (uno builda AED, otro builda ds-docs).
# Configurar build settings PER-SITE en Netlify UI:
#
# Site `aedmigration`:
#   Build command:     npm install --no-audit --no-fund && npm run build:aed
#   Publish directory: dist/aed/browser
#   Base directory:    (vacío)
#
# Site `ds-smartcontact`:
#   Build command:     npm install --no-audit --no-fund && npm run build:ds-docs
#   Publish directory: dist/ds-docs/browser
#   Base directory:    (vacío)
#
# Lo que queda en este archivo (env, redirects, headers) aplica a TODOS
# los sites que builden desde este repo — son consistentes entre AED y
# ds-docs (Angular SPA, mismo Node version, mismo cache policy).

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# SPA fallback: every unknown URL must hit index.html so the Angular Router
# can take over (otherwise refreshing /admin/labels returns a 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
