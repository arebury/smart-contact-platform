<div class="bulk-edit" role="group" aria-label="Editar en bloque">
  <span class="bulk-edit__pair">
    <span class="bulk-edit__lead">Cambiar</span>
    <sc-select
      class="bulk-edit__select"
      size="sm"
      optionLabel="label"
      optionValue="key"
      [options]="fields()"
      [value]="selectedFieldKey()"
      (valueChange)="onFieldValueChange($event)"
      name="bulk-field"
    />
  </span>

  <span class="bulk-edit__pair">
    <span class="bulk-edit__lead">a</span>
    <sc-select
      class="bulk-edit__select"
      size="sm"
      optionLabel="label"
      optionValue="value"
      [options]="selectedField()?.values ?? []"
      [value]="selectedValue()"
      (valueChange)="onValueValueChange($event)"
      name="bulk-value"
    />
  </span>

  <button
    type="button"
    class="btn btn--secondary bulk-edit__apply"
    [disabled]="!canApply()"
    (click)="onApply()"
  >
    Aplicar
  </button>
</div>
