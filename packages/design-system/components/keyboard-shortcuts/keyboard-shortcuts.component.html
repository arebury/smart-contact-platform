@if (visible()) {
  <div class="kbd-backdrop" (click)="onBackdropClick()" aria-hidden="true"></div>
  <div class="kbd-sheet" role="dialog" aria-label="Atajos de teclado" aria-modal="true">
    <div class="kbd-sheet__head">
      <h2 class="kbd-sheet__title">Atajos de teclado</h2>
      <button type="button" class="kbd-sheet__close" (click)="onClose()" aria-label="Cerrar">
        <lucide-icon [img]="closeIcon" [size]="iconSizeDefault" aria-hidden="true" />
      </button>
    </div>

    <div class="kbd-sheet__body">
      @for (group of groups; track group.title) {
        <div class="kbd-sheet__group">
          <div class="kbd-sheet__group-title">{{ group.title }}</div>
          @for (item of group.items; track item.label) {
            <div class="kbd-sheet__row">
              <span class="kbd-sheet__label">{{ item.label }}</span>
              <span class="kbd-sheet__keys">
                @for (k of item.keys; track $index) {
                  <kbd>{{ k }}</kbd>
                }
              </span>
            </div>
          }
        </div>
      }
    </div>
  </div>
}
