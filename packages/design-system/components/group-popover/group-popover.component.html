<button
  #trigger
  type="button"
  class="group-popover__trigger"
  [attr.aria-label]="'common.groups_count' | translate: { count: count() }"
  (mouseenter)="onTriggerEnter($event)"
  (mouseleave)="onPointerLeave()"
  (focus)="onTriggerFocus($event)"
  (blur)="onPointerLeave()"
  (keydown)="onKeydown($event)"
>
  {{ 'common.groups_count_short' | translate: { count: count() } }}
</button>

<p-popover
  #pop
  styleClass="group-popover__panel"
  appendTo="body"
>
  @if (count() > 0) {
    <div
      class="group-popover__body"
      (mouseenter)="onPanelEnter()"
      (mouseleave)="onPointerLeave()"
    >
      <ul class="group-popover__list">
        @for (group of visible(); track group.id) {
          <li class="group-popover__item">{{ group.name }}</li>
        }
      </ul>
      @if (overflowCount() > 0) {
        <div class="group-popover__more">
          {{ 'common.groups_more' | translate: { count: overflowCount() } }}
        </div>
      }
    </div>
  }
</p-popover>
